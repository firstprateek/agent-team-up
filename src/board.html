<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Team board</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3dd;
  --accent: #2f5bd3; --accent-ink: #ffffff; --soft: #eef1fb;
  --open: #6b6b66; --working: #2f5bd3; --review: #7b4bc4; --blocked: #b86e00; --done: #2e7d4f; --dropped: #9a9a94;
  --warn-bg: #fff5e0; --warn-line: #f0d9a8;
  --radius: 10px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.45;
}
:root[data-theme="dark"] {
  --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9c9b95; --line: #33332f;
  --accent: #7e9cf2; --accent-ink: #10131c; --soft: #232838;
  --open: #9c9b95; --working: #7e9cf2; --review: #b393ea; --blocked: #e0a648; --done: #6cc28f; --dropped: #6d6d68;
  --warn-bg: #2d2617; --warn-line: #574622;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9c9b95; --line: #33332f;
    --accent: #7e9cf2; --accent-ink: #10131c; --soft: #232838;
    --open: #9c9b95; --working: #7e9cf2; --review: #b393ea; --blocked: #e0a648; --done: #6cc28f; --dropped: #6d6d68;
    --warn-bg: #2d2617; --warn-line: #574622;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
body.app { background: transparent; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
body.app main { padding: 12px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
.live { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dropped); }
.live.on::before { background: var(--done); }
.spacer { flex: 1; }
a.btn { text-decoration: none; display: inline-block; }
button, .btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
textarea { resize: vertical; min-height: 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.stack > * + * { margin-top: 10px; }
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.agent .name { font-weight: 600; display: flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dropped); flex: none; }
.dot.busy { background: var(--working); } .dot.free { background: var(--done); } .dot.resting { background: var(--blocked); }
.agent .what { font-size: 13px; margin-top: 4px; }
.small { font-size: 12px; color: var(--muted); }
.question { background: var(--warn-bg); border-color: var(--warn-line); }
.question .row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
.question textarea { min-height: 38px; }
.goal-head { display: flex; align-items: baseline; gap: 10px; }
.goal-head .title { font-weight: 600; flex: 1; }
.bar { height: 4px; border-radius: 2px; background: var(--line); margin: 8px 0 4px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--done); }
.tasks { list-style: none; padding: 0; margin: 6px 0 0; }
.tasks li { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: baseline; }
.tasks li:first-child { border-top: 0; }
.tasks .id { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.tasks .t { min-width: 0; }
.tasks .note { font-size: 12px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.tasks .who { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; margin-right: 6px; text-transform: lowercase; }
.s-open { color: var(--open); } .s-working { color: var(--working); } .s-review { color: var(--review); }
.s-blocked { color: var(--blocked); } .s-done { color: var(--done); } .s-dropped { color: var(--dropped); }
li.done .title, li.dropped .title { color: var(--muted); }
li.dropped .title { text-decoration: line-through; }
details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details[open] summary { margin-bottom: 8px; }
.feed { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.feed li { padding: 5px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 48px 1fr; gap: 8px; }
.feed li:first-child { border-top: 0; }
.feed li.more { display: block; }
.feed .when { color: var(--muted); font-variant-numeric: tabular-nums; }
.feed .from { font-weight: 600; }
.feed li.question-ev, .feed li.answer-ev { background: var(--warn-bg); }
.forms { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.forms form > * + * { margin-top: 8px; }
.forms .row { display: flex; gap: 8px; }
.empty { color: var(--muted); font-size: 14px; }
.err { color: var(--blocked); font-size: 13px; min-height: 1em; }
#login { max-width: 380px; margin: 12vh auto 0; }
#login p { color: var(--muted); font-size: 14px; }
.hidden { display: none !important; }
@media (max-width: 640px) {
  .forms { grid-template-columns: 1fr; }
  .tasks li { grid-template-columns: 36px 1fr; }
  .tasks .who { grid-column: 2; text-align: left; }
}
</style>
</head>
<body>
<main>
  <div id="login" class="card stack hidden">
    <h1>Team board</h1>
    <p>Sign in with the owner key that <code>agent-team-up init</code> printed.</p>
    <form id="login-form" class="stack">
      <input id="login-key" type="password" autocomplete="current-password" placeholder="owner_…" aria-label="Owner key" required>
      <button class="primary" type="submit">Sign in</button>
      <div class="err" id="login-err" role="alert"></div>
    </form>
  </div>

  <div id="board" class="hidden">
    <header>
      <h1>Team board</h1>
      <span id="live" class="live">offline</span>
      <span class="spacer"></span>
      <a id="wiki-link" class="btn hidden" href="/wiki">Wiki</a>
      <button id="refresh" type="button" class="hidden">Refresh</button>
      <button id="logout" type="button" class="hidden">Sign out</button>
    </header>

    <section id="team" class="team" aria-label="Team"></section>

    <section id="needs" class="hidden">
      <h2>Needs you</h2>
      <div id="questions" class="stack"></div>
    </section>

    <section>
      <h2>Goals</h2>
      <div id="goals" class="stack"></div>
    </section>

    <section id="owner-forms" class="hidden">
      <h2>Post</h2>
      <div class="forms">
        <form id="goal-form" class="card">
          <input name="title" placeholder="New goal" aria-label="Goal title" required maxlength="200">
          <textarea name="detail" placeholder="What done looks like (optional)" aria-label="Goal detail"></textarea>
          <div class="row"><span class="spacer"></span><button class="primary" type="submit">Post goal</button></div>
        </form>
        <form id="msg-form" class="card">
          <select name="to" aria-label="Send to"></select>
          <textarea name="text" placeholder="Message" aria-label="Message" required></textarea>
          <div class="row"><span class="spacer"></span><button class="primary" type="submit">Send</button></div>
        </form>
      </div>
      <div class="err" id="form-err" role="alert"></div>
    </section>

    <section>
      <h2>Activity</h2>
      <div class="card"><ul id="feed" class="feed"></ul></div>
    </section>
  </div>
</main>
<script>
(() => {
  'use strict';
  const inApp = window.parent !== window;
  const $ = (id) => document.getElementById(id);
  let state = null;
  let clockSkew = 0;

  // ── DOM helpers (all text goes in as text, never as HTML) ──
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  const now = () => Date.now() + clockSkew;
  function ago(ms) {
    if (!ms) return 'never';
    const s = Math.max(0, Math.round((now() - ms) / 1000));
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    return Math.round(s / 86400) + 'd ago';
  }
  function clock(ms) {
    const d = new Date(ms);
    return now() - ms < 86400000 ? d.toTimeString().slice(0, 5) : d.toISOString().slice(5, 10);
  }

  // ── Rendering ──
  function render(s) {
    if (!s) return;
    state = s;
    clockSkew = s.now - Date.now();
    $('login').classList.add('hidden');
    $('board').classList.remove('hidden');
    $('wiki-link').classList.toggle('hidden', !(s.wiki && !inApp));

    const busy = (name) => s.tasks.filter((t) => t.claimed_by === name && t.state === 'working');
    $('team').replaceChildren(...(s.agents.length ? s.agents.map((a) => {
      const doing = busy(a.name);
      const away = !a.last_seen || now() - a.last_seen > 15 * 60000;
      const kind = a.status === 'resting' ? 'resting' : doing.length ? 'busy' : away ? 'away' : 'free';
      const what = a.status === 'resting'
        ? 'Resting' + (a.resting_until ? ' until ' + new Date(a.resting_until).toTimeString().slice(0, 5) : '') + (a.status_note ? ': ' + a.status_note : '')
        : doing.length ? doing.map((t) => '#' + t.id + ' ' + t.title).join(', ') : away ? (a.last_seen ? 'Away' : 'Not connected yet') : 'Free';
      return h('div', { class: 'card agent' },
        h('div', { class: 'name' }, h('span', { class: 'dot ' + kind, 'aria-hidden': 'true' }), a.name),
        h('div', { class: 'what' }, what),
        h('div', { class: 'small' }, (a.strengths ? a.strengths + ' · ' : '') + 'seen ' + ago(a.last_seen)));
    }) : [h('div', { class: 'empty' }, 'No agents yet. Add one with agent-team-up add <name>.')]));

    $('needs').classList.toggle('hidden', s.questions.length === 0);
    $('questions').replaceChildren(...s.questions.map((q) => {
      const box = h('textarea', { 'aria-label': 'Answer to Q' + q.id, placeholder: 'Your answer' });
      const err = h('div', { class: 'err', role: 'alert' });
      const form = h('form', { class: 'row', onsubmit: async (e) => {
        e.preventDefault();
        if (!box.value.trim()) return;
        try { await post('/api/questions/' + q.id + '/answer', { text: box.value }); } catch (x) { err.textContent = x.message; }
      } }, box, h('button', { class: 'primary', type: 'submit' }, 'Answer'));
      return h('div', { class: 'card question' },
        h('div', { class: 'small' }, 'Q' + q.id + ' from ' + q.asker + (q.task_id ? ' about #' + q.task_id : '') + ' · ' + ago(q.asked_at)),
        h('div', {}, q.text),
        inApp ? null : form, err);
    }));

    const goalCard = (g, tasks) => {
      const done = tasks.filter((t) => t.state === 'done').length;
      const live = tasks.filter((t) => t.state !== 'dropped').length;
      return h('div', { class: 'card' },
        h('div', { class: 'goal-head' },
          h('span', { class: 'title' }, g ? 'G' + g.id + ' ' + g.title : 'No goal'),
          g && g.state !== 'open' ? h('span', { class: 'pill s-done' }, g.state) : null,
          h('span', { class: 'small' }, done + '/' + live + ' done'),
          g && g.state === 'open' && !inApp ? h('button', { type: 'button', onclick: () => post('/api/goals/' + g.id, { state: 'done' }).catch(alertErr) }, 'Mark done') : null),
        g && g.detail ? h('div', { class: 'small' }, g.detail) : null,
        live ? h('div', { class: 'bar' }, h('span', { style: 'width:' + Math.round((done / live) * 100) + '%' })) : null,
        tasks.length ? h('ul', { class: 'tasks' }, tasks.map(taskRow)) : h('div', { class: 'empty small' }, 'No tasks yet. An agent will break it down.'));
    };
    const taskRow = (t) => h('li', { class: t.state },
      h('span', { class: 'id' }, '#' + t.id),
      h('div', { class: 't' },
        h('span', { class: 'pill s-' + t.state }, t.state),
        h('span', { class: 'title' }, t.title),
        t.note ? h('div', { class: 'note' }, t.note) : null,
        t.links ? h('div', { class: 'note' }, t.links) : null),
      h('span', { class: 'who' }, t.claimed_by || (t.for_agent ? 'for ' + t.for_agent : 'anyone')));

    const cards = s.goals.map((g) => goalCard(g, s.tasks.filter((t) => t.goal_id === g.id)));
    const loose = s.tasks.filter((t) => t.goal_id === null || !s.goals.some((g) => g.id === t.goal_id));
    if (loose.length) cards.push(goalCard(null, loose));
    $('goals').replaceChildren(...(cards.length ? cards : [h('div', { class: 'empty' }, inApp ? 'No goals yet.' : 'No goals yet. Post one below.')]));

    const to = document.querySelector('#msg-form select');
    const pick = to.value;
    to.replaceChildren(h('option', { value: 'all' }, 'Everyone'), ...s.agents.map((a) => h('option', { value: a.name }, a.name)));
    if ([...to.options].some((o) => o.value === pick)) to.value = pick;

    const evRow = (e) => {
      const to = e.kind === 'message' || e.kind === 'handoff' ? ' → ' + e.audience : '';
      return h('li', { class: e.kind + '-ev' },
        h('span', { class: 'when' }, clock(e.at)),
        h('span', {}, h('span', { class: 'from' }, e.sender + to), ' ', e.text));
    };
    const evs = s.events.slice().reverse();
    const wasOpen = !!document.querySelector('#feed details[open]');
    $('feed').replaceChildren(...(evs.length ? evs.slice(0, 20).map(evRow) : [h('li', { class: 'empty' }, 'Nothing yet.')]),
      evs.length > 20 ? h('li', { class: 'more' }, h('details', { open: wasOpen },
        h('summary', {}, 'Earlier (' + (evs.length - 20) + ')'),
        h('ul', { class: 'feed' }, evs.slice(20).map(evRow)))) : null);
  }

  function alertErr(e) { $('form-err').textContent = e.message; }

  // ── Web mode: owner API with a session cookie, live over server-sent events ──
  async function api(path, opts) {
    const r = await fetch(path, { credentials: 'same-origin', ...opts });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin(); throw new Error(body.error || 'Signed out.'); }
    if (!r.ok) throw new Error(body.error || 'Request failed (' + r.status + ').');
    return body;
  }
  function post(path, body) {
    $('form-err').textContent = '';
    return api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then((x) => { load(); return x; });
  }
  async function load() {
    try { render(await api('/api/state')); } catch (e) { /* login shown or transient */ }
  }
  function showLogin() {
    $('board').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-key').focus();
  }
  let es = null;
  function listen() {
    if (es) es.close();
    es = new EventSource('/api/stream');
    es.addEventListener('open', () => { $('live').classList.add('on'); $('live').textContent = 'live'; load(); });
    es.addEventListener('change', load);
    es.addEventListener('error', () => { $('live').classList.remove('on'); $('live').textContent = 'reconnecting'; });
  }
  function startWeb() {
    $('owner-forms').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('login-err').textContent = '';
      try {
        await api('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: $('login-key').value.trim() }) });
        $('login-key').value = '';
        await load();
        listen();
      } catch (x) { $('login-err').textContent = x.message; }
    });
    $('logout').addEventListener('click', async () => {
      await api('/api/logout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }).catch(() => {});
      if (es) es.close();
      showLogin();
    });
    $('goal-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      post('/api/goals', { title: f.elements.title.value, detail: f.elements.detail.value }).then(() => f.reset()).catch(alertErr);
    });
    $('msg-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target;
      post('/api/messages', { to: f.elements.to.value, text: f.elements.text.value }).then(() => { f.elements.text.value = ''; }).catch(alertErr);
    });
    setInterval(() => state && render(state), 30000); // keep "seen 3m ago" current
    load().then(() => { if (state) listen(); });
  }

  // ── App mode: the MCP Apps protocol (JSON-RPC over postMessage with the host) ──
  let nextId = 1;
  const pending = new Map();
  function rpc(method, params) {
    const id = nextId++;
    window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method, params: params || {} }, '*'); }
  function theme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }
  function onHostMessage(ev) {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== '2.0') return;
    if (m.method === undefined && m.id !== undefined) {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || 'Host error')); else p.resolve(m.result);
      return;
    }
    if (m.method === 'ui/notifications/tool-result') render(m.params && m.params.structuredContent);
    else if (m.method === 'ui/notifications/host-context-changed') theme(m.params && m.params.theme);
    else if (m.id !== undefined) window.parent.postMessage({ jsonrpc: '2.0', id: m.id, result: {} }, '*'); // ping, teardown
  }
  async function startApp() {
    document.body.classList.add('app');
    $('board').classList.remove('hidden');
    $('refresh').classList.remove('hidden');
    $('live').classList.add('hidden');
    window.addEventListener('message', onHostMessage);
    const init = await rpc('ui/initialize', {
      appInfo: { name: 'agent-team-up board', version: '0.1.0' },
      appCapabilities: {},
      protocolVersion: '2026-01-26',
    });
    theme(init && init.hostContext && init.hostContext.theme);
    notify('ui/notifications/initialized');
    let last = 0;
    new ResizeObserver(() => {
      const height = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (height !== last) { last = height; notify('ui/notifications/size-changed', { height }); }
    }).observe(document.documentElement);
    $('refresh').addEventListener('click', async () => {
      const r = await rpc('tools/call', { name: 'board', arguments: {} });
      render(r && r.structuredContent);
    });
  }

  if (inApp) startApp(); else startWeb();
})();
</script>
</body>
</html>
