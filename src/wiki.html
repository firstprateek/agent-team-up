<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Team wiki</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f6f3; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e4e3dd;
  --accent: #2f5bd3; --accent-ink: #ffffff; --soft: #eef1fb; --code: #efeee9;
  --add: #1f7a45; --add-bg: #e6f4ea; --del: #b3261e; --del-bg: #fbe9e7;
  --radius: 10px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.5;
}
:root[data-theme="dark"] {
  --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9c9b95; --line: #33332f;
  --accent: #7e9cf2; --accent-ink: #10131c; --soft: #232838; --code: #2a2a27;
  --add: #6cc28f; --add-bg: #1b2b21; --del: #f0948d; --del-bg: #33201e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9c9b95; --line: #33332f;
    --accent: #7e9cf2; --accent-ink: #10131c; --soft: #232838; --code: #2a2a27;
    --add: #6cc28f; --add-bg: #1b2b21; --del: #f0948d; --del-bg: #33201e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); }
main { max-width: 900px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 10px 14px; margin-bottom: 16px; flex-wrap: wrap; }
h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { padding: 4px 10px; border-radius: 7px; color: var(--muted); font-size: 14px; }
nav a.on { background: var(--soft); color: var(--accent); font-weight: 600; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.spacer { flex: 1; }
button, .btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
a.btn { text-decoration: none; display: inline-block; }
button:hover, a.btn:hover { border-color: var(--muted); text-decoration: none; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; width: 100%; }
.search { flex: 1; min-width: 160px; max-width: 320px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
.stack > * + * { margin-top: 10px; }
.small { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; }
.err { color: #b86e00; font-size: 13px; min-height: 1em; }
.hidden { display: none !important; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 9px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; }
.list .t { font-weight: 600; }
.list .d { color: var(--muted); font-size: 14px; }
.list .snip { font-size: 13px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.chip { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); margin: 0 4px 4px 0; }
a.chip:hover { border-color: var(--accent); text-decoration: none; }
.chip.on { background: var(--soft); color: var(--accent); border-color: var(--accent); }
h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
.doc h1 { font-size: 22px; margin: 0 0 4px; }
.doc .desc { color: var(--muted); margin: 0 0 8px; }
.md { overflow-wrap: anywhere; }
.md h2 { font-size: 19px; margin: 22px 0 8px; } .md h3 { font-size: 16px; margin: 18px 0 6px; }
.md h4, .md h5, .md h6 { font-size: 14px; margin: 14px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--code); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--code); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 0 0 10px; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; margin: 0 0 10px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; }
.md th { background: var(--soft); }
.broken { text-decoration: line-through; color: var(--muted); }
.diff { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; overflow-x: auto; padding: 8px 0; }
.diff div { padding: 0 12px; white-space: pre; min-height: 1.5em; }
.diff .add { background: var(--add-bg); color: var(--add); } .diff .del { background: var(--del-bg); color: var(--del); }
.diff .hunk, .diff .meta { color: var(--muted); }
.graph { width: 100%; height: auto; display: block; }
.graph line { stroke: var(--line); stroke-width: 1.2; }
.graph circle { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.graph text { fill: var(--ink); font-size: 11px; }
.graph a:hover circle, .graph a:focus circle { fill: var(--ink); }
#login { max-width: 380px; margin: 12vh auto 0; }
#login p { color: var(--muted); font-size: 14px; }
@media (max-width: 640px) { .search { max-width: none; flex-basis: 100%; order: 5; } }
</style>
</head>
<body>
<main>
  <div id="login" class="card stack hidden">
    <h1>Team wiki</h1>
    <p>Sign in with the owner key that <code>agent-team-up init</code> printed.</p>
    <form id="login-form" class="stack">
      <input id="login-key" type="password" autocomplete="current-password" placeholder="owner_…" aria-label="Owner key" required>
      <button class="primary" type="submit">Sign in</button>
      <div class="err" id="login-err" role="alert"></div>
    </form>
  </div>

  <div id="app" class="hidden">
    <header>
      <h1>Team wiki</h1>
      <nav id="nav" aria-label="Wiki"></nav>
      <form id="search-form" class="search" role="search"><input id="q" type="search" placeholder="Search pages" aria-label="Search pages"></form>
      <span class="spacer"></span>
      <a class="btn" href="/board">Board</a>
      <button id="reload" type="button">Refresh</button>
    </header>
    <div id="view" class="stack"></div>
  </div>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const SVGNS = 'http://www.w3.org/2000/svg';

  // All text goes in as text, never as HTML.
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, String(v));
    for (const kid of kids) if (kid !== null && kid !== undefined) el.append(kid instanceof Node ? kid : String(kid));
    return el;
  }

  async function api(path) {
    const r = await fetch(path, { credentials: 'same-origin' });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin(); throw new Error(body.error || 'Signed out.'); }
    if (!r.ok) { const e = new Error(body.error || 'Request failed (' + r.status + ').'); e.status = r.status; throw e; }
    return body;
  }

  let pages = [];
  let known = new Set();

  // ── Markdown, as DOM nodes ──
  function safeUrl(u) {
    try { const x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:' ? x.href : null; } catch (e) { return null; }
  }
  const INLINE = /`([^`]+)`|\[\[([a-z0-9][a-z0-9-]*)\]\]|\[([^\]]+)\]\(([^)\s]+)\)|\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*|(?<![\w])_([^_]+)_(?![\w])/g;
  function inline(text) {
    const out = [];
    let last = 0;
    for (const m of text.matchAll(INLINE)) {
      if (m.index > last) out.push(text.slice(last, m.index));
      last = m.index + m[0].length;
      if (m[1] !== undefined) out.push(h('code', {}, m[1]));
      else if (m[2] !== undefined) out.push(known.has(m[2]) ? h('a', { href: '#page/' + m[2] }, m[2]) : h('span', { class: 'broken', title: 'No such page' }, m[2]));
      else if (m[3] !== undefined) {
        const u = safeUrl(m[4]);
        out.push(u ? h('a', { href: u, target: '_blank', rel: 'noopener noreferrer' }, m[3]) : m[3] + ' (' + m[4] + ')');
      }
      else if (m[5] !== undefined) out.push(h('strong', {}, inline(m[5])));
      else out.push(h('em', {}, inline(m[6] !== undefined ? m[6] : m[7])));
    }
    if (last < text.length) out.push(text.slice(last));
    return out;
  }
  const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const isRule = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
  const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  function markdown(src) {
    const lines = src.replace(/\r\n/g, '\n').split('\n');
    const root = h('div', { class: 'md' });
    let i = 0;
    const special = (l, next) => /^\s*```/.test(l) || /^#{1,6}\s/.test(l) || LI.test(l) || (l.includes('|') && next !== undefined && isRule(next) && next.includes('|'));
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*```/.test(l)) {
        const code = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
        i++;
        root.append(h('pre', {}, h('code', {}, code.join('\n'))));
        continue;
      }
      let m = /^(#{1,6})\s+(.*)$/.exec(l);
      if (m) { root.append(h('h' + Math.min(6, m[1].length + 1), {}, inline(m[2].trim()))); i++; continue; }
      if (l.includes('|') && lines[i + 1] !== undefined && lines[i + 1].includes('|') && isRule(lines[i + 1])) {
        const head = cells(l);
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].includes('|')) rows.push(cells(lines[i++]));
        root.append(h('table', {}, h('thead', {}, h('tr', {}, head.map((c) => h('th', {}, inline(c))))),
          h('tbody', {}, rows.map((r) => h('tr', {}, head.map((_, k) => h('td', {}, inline(r[k] || ''))))))));
        continue;
      }
      if ((m = LI.exec(l))) {
        const ordered = /\d/.test(m[2]);
        const base = m[1].length;
        const top = h(ordered ? 'ol' : 'ul', {});
        let sub = null, item = null, itemText = [];
        const flush = () => { if (item) { item.prepend(...inline(itemText.join(' '))); item = null; itemText = []; } };
        while (i < lines.length) {
          const x = lines[i];
          const lm = LI.exec(x);
          if (lm) {
            if (lm[1].length > base + 1 && item) {
              if (!sub) { sub = h(/\d/.test(lm[2]) ? 'ol' : 'ul', {}); item.append(sub); }
              sub.append(h('li', {}, inline(lm[3])));
            } else if (lm[1].length <= base + 1) {
              flush();
              sub = null;
              item = h('li', {});
              itemText = [lm[3]];
              top.append(item);
            } else break;
            i++;
          } else if (x.trim() && /^\s+/.test(x) && item && !sub) { itemText.push(x.trim()); i++; }
          else break;
        }
        flush();
        root.append(top);
        continue;
      }
      const para = [];
      while (i < lines.length && lines[i].trim() && (para.length === 0 || !special(lines[i], lines[i + 1]))) para.push(lines[i++].trim());
      root.append(h('p', {}, inline(para.join(' '))));
    }
    return root;
  }

  // ── Views ──
  const view = $('view');
  const chips = (tags) => tags.map((t) => h('a', { class: 'chip', href: '#tag/' + encodeURIComponent(t) }, t));
  const when = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toISOString().slice(0, 16).replace('T', ' '); };

  function pageRow(p, snip) {
    return h('li', {},
      h('a', { class: 't', href: '#page/' + p.slug }, p.title), ' ', h('span', { class: 'small' }, p.slug + (p.updated ? ' · ' + p.updated : '')),
      p.description ? h('div', { class: 'd' }, p.description) : null,
      snip ? h('div', { class: 'snip' }, snip) : null,
      p.tags && p.tags.length ? h('div', {}, chips(p.tags)) : null);
  }

  function pagesView(tag) {
    const all = tag ? pages.filter((p) => p.tags.includes(tag)) : pages;
    const tags = [...new Set(pages.flatMap((p) => p.tags))].sort();
    return [
      tags.length ? h('div', {}, h('a', { class: 'chip' + (tag ? '' : ' on'), href: '#pages' }, 'all'), tags.map((t) => h('a', { class: 'chip' + (t === tag ? ' on' : ''), href: '#tag/' + encodeURIComponent(t) }, t))) : null,
      h('div', { class: 'card' }, all.length ? h('ul', { class: 'list' }, all.map((p) => pageRow(p))) : h('div', { class: 'empty' }, pages.length ? 'No pages with that tag.' : 'No pages yet. Agents add them with wiki_save.')),
    ];
  }

  async function searchView(q) {
    $('q').value = q;
    const hits = await api('/api/wiki/search?q=' + encodeURIComponent(q));
    return [h('h2', { class: 'sec' }, 'Search: ' + q),
      h('div', { class: 'card' }, hits.length ? h('ul', { class: 'list' }, hits.map((x) => pageRow(x, x.snippet))) : h('div', { class: 'empty' }, 'No pages match.'))];
  }

  async function pageView(slug) {
    let p;
    try { p = await api('/api/wiki/page?slug=' + encodeURIComponent(slug)); }
    catch (e) { if (e.status === 404) return [h('div', { class: 'card empty' }, 'No page called ' + slug + '. ', h('a', { href: '#pages' }, 'All pages'))]; throw e; }
    const link = (x) => known.has(x) ? h('a', { href: '#page/' + x }, x) : h('span', { class: 'broken' }, x);
    const commaList = (xs) => xs.length ? xs.flatMap((x, k) => [k ? ', ' : null, link(x)]) : h('span', { class: 'small' }, 'none');
    return [
      h('div', { class: 'card doc' },
        h('h1', {}, p.meta.title),
        p.meta.description ? h('p', { class: 'desc' }, p.meta.description) : null,
        h('div', { class: 'small' }, p.slug + (p.meta.updated ? ' · updated ' + p.meta.updated : '') + (p.meta.aliases.length ? ' · aka ' + p.meta.aliases.join(', ') : '')),
        p.meta.tags.length ? h('div', { style: 'margin-top:6px' }, chips(p.meta.tags)) : null,
        h('div', { style: 'margin-top:14px' }, markdown(p.body))),
      h('div', { class: 'card' },
        h('div', {}, h('strong', {}, 'Links to: '), commaList(p.linksOut)),
        h('div', { style: 'margin-top:6px' }, h('strong', {}, 'Linked from: '), commaList(p.linksIn))),
      h('h2', { class: 'sec' }, 'History'),
      h('div', { class: 'card' }, p.history.length
        ? h('ul', { class: 'list' }, p.history.map((c) => h('li', {}, h('a', { href: '#commit/' + c.sha }, c.message), h('div', { class: 'small' }, when(c.when) + ' · ' + c.author + ' · ' + c.sha.slice(0, 7)))))
        : h('div', { class: 'empty' }, p.git ? 'No commits for this page yet.' : 'No history: the wiki folder is not a git repo.')),
    ];
  }

  async function changesView() {
    const cs = await api('/api/wiki/changes');
    return [h('h2', { class: 'sec' }, 'Recent changes'),
      h('div', { class: 'card' }, cs.length ? h('ul', { class: 'list' }, cs.map((c) => h('li', {},
        h('a', { href: '#commit/' + c.sha }, c.message),
        h('div', { class: 'small' }, when(c.when) + ' · ' + c.author + ' · ',
          c.pages.flatMap((x, k) => [k ? ', ' : null, known.has(x) ? h('a', { href: '#page/' + x }, x) : x])))))
        : h('div', { class: 'empty' }, 'No changes to show. History needs the wiki folder to be a git repo with commits under pages/.'))];
  }

  async function commitView(sha) {
    const c = await api('/api/wiki/commit?sha=' + encodeURIComponent(sha));
    const cls = (l) => l.startsWith('+++') || l.startsWith('---') || l.startsWith('diff ') || l.startsWith('index ') ? 'meta' : l.startsWith('@@') ? 'hunk' : l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : '';
    return [h('p', {}, h('a', { href: '#changes' }, '← Recent changes')),
      h('div', { class: 'card' }, h('strong', {}, c.message), h('div', { class: 'small' }, when(c.when) + ' · ' + c.author + ' · ' + c.sha.slice(0, 7))),
      h('div', { class: 'card diff' }, c.diff.trim() ? c.diff.replace(/\n$/, '').split('\n').map((l) => h('div', { class: cls(l) }, l)) : h('div', { class: 'empty' }, 'No changes under pages/.'))];
  }

  function graphView() {
    if (!pages.length) return [h('div', { class: 'card empty' }, 'No pages yet.')];
    const W = 800, H = 560, n = pages.length;
    const idx = new Map(pages.map((p, k) => [p.slug, k]));
    const nodes = pages.map((p, k) => ({ p, x: W / 2 + Math.cos(k * 2.4) * (40 + k * 3), y: H / 2 + Math.sin(k * 2.4) * (40 + k * 3), vx: 0, vy: 0 }));
    const edges = [];
    for (const p of pages) for (const t of p.links) if (idx.has(t) && t !== p.slug) edges.push([idx.get(p.slug), idx.get(t)]);
    const k = Math.sqrt((W * H) / n) * 0.6;
    for (let it = 0; it < 300; it++) {
      const cool = 1 - it / 300;
      for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
        let dx = nodes[a].x - nodes[b].x, dy = nodes[a].y - nodes[b].y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 0.01) { dx = 0.1; dy = 0.1; d2 = 0.02; }
        const f = (k * k) / d2;
        nodes[a].vx += dx * f; nodes[a].vy += dy * f; nodes[b].vx -= dx * f; nodes[b].vy -= dy * f;
      }
      for (const [a, b] of edges) {
        const dx = nodes[b].x - nodes[a].x, dy = nodes[b].y - nodes[a].y;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        const f = (d - k * 0.8) * 0.05;
        nodes[a].vx += (dx / d) * f * d * 0.1; nodes[a].vy += (dy / d) * f * d * 0.1;
        nodes[b].vx -= (dx / d) * f * d * 0.1; nodes[b].vy -= (dy / d) * f * d * 0.1;
      }
      for (const o of nodes) {
        o.vx += (W / 2 - o.x) * 0.01; o.vy += (H / 2 - o.y) * 0.01;
        const sp = Math.sqrt(o.vx * o.vx + o.vy * o.vy) || 1;
        const lim = Math.min(sp, 30 * cool + 1);
        o.x = Math.min(W - 30, Math.max(30, o.x + (o.vx / sp) * lim));
        o.y = Math.min(H - 20, Math.max(20, o.y + (o.vy / sp) * lim));
        o.vx = 0; o.vy = 0;
      }
    }
    const svg = s('svg', { class: 'graph', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Pages and the links between them' },
      ...edges.map(([a, b]) => s('line', { x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y })),
      ...nodes.map((o) => s('a', { href: '#page/' + o.p.slug },
        s('title', {}, o.p.title),
        s('circle', { cx: o.x, cy: o.y, r: 5 + Math.min(6, o.p.links.length) }),
        s('text', { x: o.x + 9, y: o.y + 4 }, o.p.slug))));
    return [h('div', { class: 'card' }, svg), h('div', { class: 'small' }, n + ' pages, ' + edges.length + ' links. Click a dot to open the page.')];
  }

  // ── Routing by URL hash ──
  function nav(active) {
    $('nav').replaceChildren(...[['pages', 'Pages'], ['changes', 'Recent changes'], ['graph', 'Graph']].map(([k, label]) => h('a', { href: '#' + k, class: active === k ? 'on' : '' }, label)));
  }
  let seq = 0;
  async function route() {
    const my = ++seq;
    const [kind, ...rest] = location.hash.replace(/^#/, '').split('/');
    const arg = decodeURIComponent(rest.join('/'));
    if (kind !== 'search') $('q').value = '';
    nav(kind === 'changes' || kind === 'commit' ? 'changes' : kind === 'graph' ? 'graph' : kind === 'page' || kind === 'search' ? '' : 'pages');
    try {
      let out;
      if (kind === 'page') out = await pageView(arg);
      else if (kind === 'search' && arg) out = await searchView(arg);
      else if (kind === 'changes') out = await changesView();
      else if (kind === 'commit') out = await commitView(arg);
      else if (kind === 'graph') out = graphView();
      else out = pagesView(kind === 'tag' ? arg : '');
      if (my === seq) { view.replaceChildren(...out); window.scrollTo(0, 0); }
    } catch (e) {
      if (my === seq) view.replaceChildren(h('div', { class: 'card err' }, e.message));
    }
  }
  async function load() {
    try {
      pages = await api('/api/wiki/pages');
      known = new Set(pages.map((p) => p.slug));
      $('login').classList.add('hidden');
      $('app').classList.remove('hidden');
      await route();
    } catch (e) {
      if ($('login').classList.contains('hidden')) { $('app').classList.remove('hidden'); view.replaceChildren(h('div', { class: 'card err' }, e.message)); }
    }
  }
  function showLogin() {
    $('app').classList.add('hidden');
    $('login').classList.remove('hidden');
    $('login-key').focus();
  }

  window.addEventListener('hashchange', route);
  $('reload').addEventListener('click', load);
  $('search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('q').value.trim();
    location.hash = q ? '#search/' + encodeURIComponent(q) : '#pages';
  });
  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-err').textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: $('login-key').value.trim() }) });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || 'Sign-in failed.');
      $('login-key').value = '';
      await load();
    } catch (x) { $('login-err').textContent = x.message; }
  });
  load();
})();
</script>
</body>
</html>
